<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-labelledby="t">
  <title id="t">View my portfolio: Data Analyst and Data Engineer, mpgranji.github.io</title>
  <defs>
    <clipPath id="card"><rect width="1000" height="310" rx="34"/></clipPath>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#D97706" stop-opacity=".5"/>
      <stop offset="1" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool">
      <stop offset="0" stop-color="#5BC0DE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#5BC0DE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .band { animation: rise .8s cubic-bezier(.22,1,.36,1) backwards; }
    .b2 { animation-delay: .12s } .b3 { animation-delay: .24s } .b4 { animation-delay: .36s }
    .b5 { animation-delay: .48s } .b6 { animation-delay: .6s }
    .arrow { animation: nudge 1.1s ease-in-out 1.2s 4; }
    /* Movement only: if animation never runs, the bands are still visible */
    @keyframes rise { from { transform: translateX(22px) } }
    @keyframes nudge { 50% { transform: translateX(9px) } }
    @media (prefers-reduced-motion: reduce) { .band, .arrow { animation: none } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="310" fill="#0B132B"/>
    <ellipse cx="20" cy="300" rx="340" ry="230" fill="url(#warm)"/>
    <ellipse cx="985" cy="10" rx="330" ry="230" fill="url(#cool)"/>

    <text x="52" y="72" fill="#5BC0DE" font-size="30" font-weight="600">Data Analyst + Data Engineer</text>
    <text x="49" y="158" fill="#F7F9FC" font-size="72" font-weight="700">View my portfolio</text>

    <rect x="52" y="196" width="520" height="78" rx="39" fill="#D97706"/>
    <text x="90" y="247" fill="#0B132B" font-size="36" font-weight="700">mpgranji.github.io</text>
    <g class="arrow">
      <path d="M492 235h40M516 218l17 17-17 17" fill="none" stroke="#0B132B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- The six chapters of the portfolio, oldest to newest -->
    <g transform="translate(712 35)">
      <rect class="band b1" y="0" width="240" height="70" rx="28" fill="#0B132B" stroke="#3A506B" stroke-width="2"/>
      <rect class="band b2" y="34" width="240" height="70" rx="28" fill="#1C2541"/>
      <rect class="band b3" y="68" width="240" height="70" rx="28" fill="#3A506B"/>
      <rect class="band b4" y="102" width="240" height="70" rx="28" fill="#5BC0DE"/>
      <rect class="band b5" y="136" width="240" height="70" rx="28" fill="#F4D6B0"/>
      <rect class="band b6" y="170" width="240" height="70" rx="28" fill="#D97706"/>
    </g>
  </g>
</svg>
